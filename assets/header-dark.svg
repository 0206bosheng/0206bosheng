<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title">
  <title id="title">Huang Bosheng (@0206bosheng)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.3" fill="#64748b"/>
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0.4" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </radialGradient>
    <mask id="edges" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="260">
      <rect width="1200" height="260" fill="url(#fade)"/>
    </mask>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="56"/>
    </filter>
    <clipPath id="card">
      <rect width="1200" height="260" rx="24"/>
    </clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <circle cx="1070" cy="20" r="150" fill="#22d3ee" opacity="0.30" filter="url(#glow)"/>
    <circle cx="120" cy="250" r="170" fill="#818cf8" opacity="0.32" filter="url(#glow)"/>
    <rect width="1200" height="260" fill="url(#dots)" opacity="0.5" mask="url(#edges)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="258.5" rx="23.25" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <text x="600" y="88" text-anchor="middle" font-family="'JetBrains Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace" font-size="22" letter-spacing="1" fill="#22d3ee">@0206bosheng</text>
  <text x="600" y="164" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="76" fill="#f1f5f9"><tspan font-weight="300">Huang </tspan><tspan font-weight="700">Bosheng</tspan></text>
  <rect x="556" y="190" width="88" height="5" rx="2.5" fill="url(#accent)"/>
</svg>
